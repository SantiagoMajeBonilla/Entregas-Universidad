<section id="promociones">
  <div class="container">
    <h2 class="section-title display-serif">Promociones de la clínica</h2>

    <div class="carousel-wrapper">
      <div id="carouselPromos" class="carousel slide shadow-sm" data-bs-ride="carousel">
        <div class="carousel-indicators">
          <button *ngFor="let promo of promociones" type="button" data-bs-target="#carouselPromos"
            [attr.data-bs-slide-to]="promo.id" [class.active]="promo.id === 0"
            [attr.aria-current]="promo.id === 0 ? 'true' : null"
            [attr.aria-label]="'Promoción ' + (promo.id + 1)"></button>
        </div>
        <div class="carousel-inner">
          <div class="carousel-item" *ngFor="let promo of promociones" [class.active]="promo.id === 0">
            <img [src]="promo.imagen" class="d-block" [alt]="promo.titulo">
            <div class="carousel-caption">
              <h3>{{ promo.titulo }}</h3>
              <p>{{ promo.descripcion }}</p>
              <a href="#registro" class="btn btn-sm btn-promo">Agendar ahora</a>
            </div>
          </div>
        </div>
        <button class="carousel-control-prev" type="button" data-bs-target="#carouselPromos" data-bs-slide="prev">
          <span class="carousel-control-prev-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Anterior</span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#carouselPromos" data-bs-slide="next">
          <span class="carousel-control-next-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Siguiente</span>
        </button>
      </div>
    </div>
  </div>
</section>
